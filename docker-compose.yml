services:
  postgres:
    image: postgres:16-alpine
    container_name: gms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gms_db
      POSTGRES_USER: gms_user
      POSTGRES_PASSWORD: gms_password
    ports:
      - "5432:5432"
    volumes:
      - gms-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  gms-postgres-data:
